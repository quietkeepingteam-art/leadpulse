function switchTab(t,el){

  let label='Showing all data';

  if(currentDateFilter==='week'){
    const d=new Date(now);d.setDate(d.getDate()-d.getDay());
    startDate=d.toISOString().split('T')[0];
    label='Showing this week';
  } else if(currentDateFilter==='month'){
    startDate=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-01`;
    label='Showing this month';
  } else if(currentDateFilter==='last_month'){
    const lm=new Date(now.getFullYear(),now.getMonth()-1,1);
    const lmEnd=new Date(now.getFullYear(),now.getMonth(),0);
    startDate=lm.toISOString().split('T')[0];
    const endDate=lmEnd.toISOString().split('T')[0];
    filteredCalls=allCalls.filter(c=>c.date&&c.date>=startDate&&c.date<=endDate);
    label=`Showing last month (${filteredCalls.length} calls)`;
    document.getElementById('filterInfo').textContent=label;
    rebuildAll();return;
  } else if(currentDateFilter==='3months'){
    const d=new Date(now);d.setMonth(d.getMonth()-3);
    startDate=d.toISOString().split('T')[0];
    label='Showing last 3 months';
  }

  if(startDate){
    filteredCalls=allCalls.filter(c=>c.date&&c.date>=startDate);
  } else {
    filteredCalls=[...allCalls];
  }
  label+=` (${filteredCalls.length} calls)`;
  document.getElementById('filterInfo').textContent=label;
  rebuildAll();
}

function rebuildAll(){
  buildScriptLibrary();
  buildCompareTab();
  buildAgentsTab();
}

// ═══ SCRIPT TRAINING LIBRARY ═══
function buildScriptLibrary(){
  const el=document.getElementById('scriptsTab');
  const calls=filteredCalls;
  const successCalls=calls.filter(c=>c.outcome==='Appointment Set'||c.outcome==='Hot Lead');
  const motPhrases={};
  successCalls.forEach(c=>{
    (c.motivations||[]).forEach(m=>{
      if(!motPhrases[m])motPhrases[m]={phrases:{},calls:0,avgDur:[],timelines:{},occupancies:{},apptFormats:{}};
      motPhrases[m].calls++;
      if(c.duration)motPhrases[m].avgDur.push(c.duration);
      if(c.timeline)motPhrases[m].timelines[c.timeline]=(motPhrases[m].timelines[c.timeline]||0)+1;
      if(c.occupancy)motPhrases[m].occupancies[c.occupancy]=(motPhrases[m].occupancies[c.occupancy]||0)+1;
      if(c.appt_format&&c.appt_format!=='No Appointment')motPhrases[m].apptFormats[c.appt_format]=(motPhrases[m].apptFormats[c.appt_format]||0)+1;
      (c.successful_phrases||[]).forEach(p=>{
        if(!p||!p.trim())return;const k=p.trim().toLowerCase();
        if(!motPhrases[m].phrases[k])motPhrases[m].phrases[k]={text:p.trim(),count:0,agents:new Set()};
        motPhrases[m].phrases[k].count++;
        if(c.agent_name)motPhrases[m].phrases[k].agents.add(c.agent_name);
      });
    });
  });
  const sorted=Object.entries(motPhrases).sort((a,b)=>b[1].calls-a[1].calls);
  if(!sorted.length){el.innerHTML=`<div class="card"><div class="empty"><div class="icon">📖</div><h4>No Training Data</h4><p>No successful calls in this date range. Try "All Time" or submit more calls.</p></div></div>`;return}

  const distressed=['Pre-Foreclosure','Tax Delinquent','Financial Hardship','Divorce'];
  const emotional=['Inherited Property','Probate','Senior Owner','Downsizing'];
  const landlord=['Tired Landlord','Absentee Owner'];

  let html=`<div class="card"><div class="card-h"><div class="card-ico" style="background:rgba(52,211,153,0.12)">📖</div><div><div class="card-title">Script Training Library</div><div class="card-sub">From ${successCalls.length} successful calls · By motivation type</div></div></div></div>`;
  sorted.forEach(([mot,data])=>{
    const phrases=Object.values(data.phrases).sort((a,b)=>b.count-a.count);
    const avgD=data.avgDur.length?Math.round(data.avgDur.reduce((a,b)=>a+b,0)/data.avgDur.length):'—';
    const topTl=Object.entries(data.timelines).sort((a,b)=>b[1]-a[1])[0];
    const topFmt=Object.entries(data.apptFormats).sort((a,b)=>b[1]-a[1])[0];
    let approach={speed:'ADAPT',cls:'spd-med',desc:'Mirror the seller\'s energy.'};
    if(distressed.includes(mot))approach={speed:'FAST',cls:'spd-fast',desc:'Lead with solutions and speed. Acknowledge, then present value in 30 seconds.'};
    if(emotional.includes(mot))approach={speed:'SLOW',cls:'spd-slow',desc:'Acknowledge personally. No price upfront. Let them talk. 15-20+ min calls convert highest.'};
    if(landlord.includes(mot))approach={speed:'DIRECT',cls:'spd-med',desc:'Frame as a business problem. Numbers and logic. "Let me get you a range."'};
    html+=`<div class="mot-section"><div class="mot-header"><span class="mot-tag">${mot}</span><span class="mot-stats">${data.calls} calls · avg ${avgD}m${topTl?` · ${topTl[0].split('(')[0].trim().toLowerCase()}`:''}${topFmt?` · ${topFmt[0].toLowerCase()}`:''}</span></div>
    <div class="approach-box"><h5><span class="spd ${approach.cls}">${approach.speed}</span>${mot}</h5><p>${approach.desc}</p></div>
    ${phrases.length?`<div class="sec-lbl" style="margin-top:14px">Proven Phrases (${phrases.length})</div>${phrases.slice(0,6).map(p=>`<div class="script-card"><span class="sc-tag verbiage">Used ${p.count}x${p.agents.size>1?` · ${p.agents.size} agents`:p.agents.size===1?` · ${[...p.agents][0]}`:''}</span><blockquote>"${p.text}"</blockquote></div>`).join('')}`:'<p style="font-size:12px;color:var(--t3);padding:12px 0">No phrases logged yet for ${mot}.</p>'}
    </div>`;
  });
  el.innerHTML=html;
}

// ═══ CALLER COMPARISON ═══
function buildCompareTab(){
  const el=document.getElementById('compareTab');
  const agents=[...new Set(filteredCalls.map(c=>c.agent_name).filter(Boolean))].sort();
  if(agents.length<2){el.innerHTML=`<div class="card"><div class="empty"><div class="icon">⚔</div><h4>Need 2+ Agents</h4><p>Comparison requires at least two agents with data in this date range.</p></div></div>`;return}
  el.innerHTML=`<div class="card"><div class="card-h"><div class="card-ico" style="background:rgba(96,165,250,0.12)">⚔</div><div><div class="card-title">Agent Comparison</div><div class="card-sub">Side-by-side — see what the top performer says differently</div></div></div>
  <div class="compare-select"><div class="cg"><label>Agent A</label><select id="callerA">${agents.map((c,i)=>`<option${i===0?' selected':''}>${c}</option>`).join('')}</select></div><div class="cg"><label>Agent B</label><select id="callerB">${agents.map((c,i)=>`<option${i===1?' selected':''}>${c}</option>`).join('')}</select></div><button class="compare-btn" onclick="runComparison()">Compare</button></div></div><div id="compareResult"></div>`;
  runComparison();
}

function runComparison(){
  const a=document.getElementById('callerA').value,b=document.getElementById('callerB').value;
  if(a===b){alert('Select two different agents.');return}
  const sA=getAgentStats(a),sB=getAgentStats(b);
  const topIs=sA.convRate>=sB.convRate?'A':'B';
  const top=topIs==='A'?sA:sB,bot=topIs==='A'?sB:sA;
  const topN=topIs==='A'?a:b,botN=topIs==='A'?b:a;
  const topPS=new Set(top.phrases.map(p=>p.text.toLowerCase())),botPS=new Set(bot.phrases.map(p=>p.text.toLowerCase()));
  const uniqTop=top.phrases.filter(p=>!botPS.has(p.text.toLowerCase())),uniqBot=bot.phrases.filter(p=>!topPS.has(p.text.toLowerCase()));
  document.getElementById('compareResult').innerHTML=`<div class="compare-wrap"><div class="vs-badge">VS</div><div class="compare-grid">${renderCol(a,sA,topIs==='A',uniqTop,topIs==='A')}${renderCol(b,sB,topIs==='B',uniqBot,topIs==='B')}</div></div>
  <div class="card" style="margin-top:20px"><div class="card-h"><div class="card-ico" style="background:rgba(0,212,170,0.12)">🧠</div><div><div class="card-title">Coaching Insight</div><div class="card-sub">What ${topN} does differently</div></div></div>
  ${uniqTop.length?`<div class="sec-lbl">Phrases only ${topN} uses</div>${uniqTop.slice(0,5).map(p=>`<div class="edge-card"><div class="edge-lbl">${topN}'s Edge</div><p>"${p.text}"</p></div>`).join('')}`:`<p style="font-size:12px;color:var(--t3)">Both use similar phrases. Difference may be in delivery.</p>`}
  ${top.convRate-bot.convRate>10?`<div style="margin-top:16px;background:rgba(255,107,107,0.06);border:1px solid rgba(255,107,107,0.12);border-radius:12px;padding:14px 16px"><div style="font-size:9px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:0.1em;margin-bottom:6px">Gap: ${(top.convRate-bot.convRate).toFixed(0)}%</div><p style="font-size:12px;color:var(--t2);line-height:1.5">${topN} converts at ${top.convRate}% vs ${botN} at ${bot.convRate}%. ${top.avgDur>bot.avgDur?topN+' spends longer per call — longer calls correlate with higher conversion.':topN+' is faster but more efficient.'}</p></div>`:''}</div>`;
}

// ═══ AGENT PROFILES ═══
function buildAgentsTab(){
  const el=document.getElementById('agentsTab');
  const agents=[...new Set(filteredCalls.map(c=>c.agent_name).filter(Boolean))].sort();
  if(!agents.length){el.innerHTML=`<div class="card"><div class="empty"><div class="icon">👤</div><h4>No Agent Data</h4><p>No calls with agent names in this date range. Add agent names when submitting calls.</p></div></div>`;return}

  el.innerHTML=`<div class="card"><div class="card-h"><div class="card-ico" style="background:rgba(167,139,250,0.12)">👤</div><div><div class="card-title">Agent Profiles</div><div class="card-sub">Select an agent to see their full performance analysis</div></div></div>
  <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
    <div style="flex:1;min-width:200px"><label style="display:block;font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:0.12em;margin-bottom:6px;font-weight:600">Agent</label><select class="agent-select" id="agentSelect">${agents.map((a,i)=>`<option${i===0?' selected':''}>${a}</option>`).join('')}</select></div>
    <button class="compare-btn" onclick="renderAgentProfile()">View Profile</button>
  </div></div><div id="agentProfileResult"></div>`;
  renderAgentProfile();
}

function renderAgentProfile(){
  const name=document.getElementById('agentSelect').value;
  const s=getAgentStats(name);
  const res=document.getElementById('agentProfileResult');
  if(!s.total){res.innerHTML=`<div class="card"><div class="empty"><div class="icon">📭</div><h4>No data for ${name}</h4></div></div>`;return}

  // Motivation breakdown
  const motCounts={};
  s.allCalls.forEach(c=>(c.motivations||[]).forEach(m=>{motCounts[m]=(motCounts[m]||0)+1}));
  const motTotal=Object.values(motCounts).reduce((a,b)=>a+b,0)||1;
  const motSorted=Object.entries(motCounts).map(([l,c])=>({label:l,count:c,pct:Math.round(c/motTotal*100)})).sort((a,b)=>b.count-a.count).slice(0,6);

  // Outcome breakdown
  const outCounts={};
  s.allCalls.forEach(c=>{outCounts[c.outcome]=(outCounts[c.outcome]||0)+1});
  const outSorted=Object.entries(outCounts).map(([l,c])=>({label:l,count:c,pct:Math.round(c/s.total*100)})).sort((a,b)=>b.count-a.count);

  // Approach tendency
  const distressed=['Pre-Foreclosure','Tax Delinquent','Financial Hardship','Divorce'];
  const emotional=['Inherited Property','Probate','Senior Owner','Downsizing'];
  const dCalls=s.allCalls.filter(c=>(c.motivations||[]).some(m=>distressed.includes(m))).length;
  const eCalls=s.allCalls.filter(c=>(c.motivations||[]).some(m=>emotional.includes(m))).length;
  let primaryApproach='Adaptive';
  if(dCalls>eCalls*2)primaryApproach='Fast/Direct — mostly distressed sellers';
  else if(eCalls>dCalls*2)primaryApproach='Slow/Empathetic — mostly life-transition sellers';
  else if(dCalls>0&&eCalls>0)primaryApproach='Mixed — handles both distressed and emotional sellers';

  res.innerHTML=`
  <div class="card">
    <div class="agent-header">
      <div class="agent-avatar">${name.charAt(0).toUpperCase()}</div>
      <div class="agent-info">
        <h3>${name}</h3>
        <p>${s.total} calls · ${s.zips.length} ZIP${s.zips.length!==1?'s':''} · ${s.topFormat||'—'} preferred · ${primaryApproach}</p>
      </div>
    </div>

    <div class="stat-row" style="grid-template-columns:repeat(5,1fr)">
      <div class="stat-box"><div class="sv">${s.total}</div><div class="sl">Total Calls</div></div>
      <div class="stat-box"><div class="sv">${s.appts}</div><div class="sl">Appointments</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--teal)">${s.convRate}%</div><div class="sl">Conversion</div></div>
      <div class="stat-box"><div class="sv">${s.avgDur}<span style="font-size:11px;color:var(--t3)">m</span></div><div class="sl">Avg Duration</div></div>
      <div class="stat-box"><div class="sv">${s.phrases.length}</div><div class="sl">Unique Phrases</div></div>
    </div>
  </div>

  <div class="agent-profile-grid">
    <div class="card">
      <div class="card-h"><div class="card-ico" style="background:rgba(0,212,170,0.12)">🎯</div><div><div class="card-title">Motivation Strengths</div><div class="card-sub">What types of leads ${name} calls most</div></div></div>
      ${motSorted.map(m=>`<div class="trend-row"><div class="trend-lbl"><span style="color:var(--t2)">${m.label}</span><span class="tv">${m.pct}%</span></div><div class="trend-bar-wrap"><div class="trend-fill" style="width:${m.pct}%;background:linear-gradient(90deg,var(--teal),rgba(0,212,170,0.5))"></div></div></div>`).join('')}
    </div>

    <div class="card">
      <div class="card-h"><div class="card-ico" style="background:rgba(96,165,250,0.12)">📊</div><div><div class="card-title">Outcome Breakdown</div><div class="card-sub">How ${name}'s calls typically end</div></div></div>
      ${outSorted.map(o=>{
        const color=o.label==='Appointment Set'?'var(--teal)':o.label==='Hot Lead'?'var(--red)':o.label==='Callback Requested'?'var(--amber)':o.label==='Not Interested'?'var(--red)':'var(--t3)';
        return`<div class="trend-row"><div class="trend-lbl"><span style="color:var(--t2)">${o.label}</span><span class="tv">${o.pct}%</span></div><div class="trend-bar-wrap"><div class="trend-fill" style="width:${o.pct}%;background:${color}"></div></div></div>`;
      }).join('')}
    </div>

    <div class="card" style="grid-column:1/-1">
      <div class="card-h"><div class="card-ico" style="background:rgba(52,211,153,0.12)">💬</div><div><div class="card-title">${name}'s Signature Phrases</div><div class="card-sub">Most-used phrases from successful calls — ranked by frequency</div></div></div>
      ${s.phrases.length?`<div class="phrase-list">${s.phrases.slice(0,10).map(p=>`<div class="phrase-item"><div class="pi-count">${p.count}</div><div class="pi-text">"${p.text}"</div></div>`).join('')}</div>`:`<p style="font-size:12px;color:var(--t3)">No phrases logged yet. Submit calls with the "Successful Phrases" field.</p>`}
    </div>

    <div class="card">
      <div class="card-h"><div class="card-ico" style="background:rgba(251,191,36,0.12)">📍</div><div><div class="card-title">ZIPs Worked</div><div class="card-sub">Where ${name} has made calls</div></div></div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${s.zipStats.map(z=>`<div style="background:var(--elevated);border:1px solid var(--border);border-radius:8px;padding:8px 12px;text-align:center"><div style="font-family:var(--fm);font-size:13px;font-weight:700;color:white">${z.zip}</div><div style="font-size:9px;color:var(--t3);margin-top:2px">${z.count} calls · ${z.convRate}%</div></div>`).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-h"><div class="card-ico" style="background:rgba(167,139,250,0.12)">⚡</div><div><div class="card-title">Approach Profile</div><div class="card-sub">How ${name} typically handles calls</div></div></div>
      <div class="approach-box"><h5>Primary Style</h5><p>${primaryApproach}</p></div>
      <div class="approach-box"><h5>Format Preference</h5><p>${s.topFormat?s.topFormat+' appointments':'No preference detected'}</p></div>
      <div class="approach-box"><h5>Call Length</h5><p>Average ${s.avgDur} minutes per call. ${s.avgDur>=12?'Longer calls — takes time to build rapport.':s.avgDur>=8?'Moderate length — balanced approach.':'Quick calls — gets to the point fast.'}</p></div>
    </div>
  </div>`;
}

// ═══ SHARED STATS ═══
function getAgentStats(name){
  const calls=filteredCalls.filter(c=>c.agent_name===name);
  const total=calls.length;
  const appts=calls.filter(c=>c.outcome==='Appointment Set'||c.outcome==='Hot Lead');
  const convRate=total?Math.round((appts.length/total)*1000)/10:0;
  const durs=calls.filter(c=>c.duration).map(c=>c.duration);
  const avgDur=durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):0;
  const phrases=[];
  appts.forEach(c=>(c.successful_phrases||[]).forEach(p=>{
    if(!p||!p.trim())return;const k=p.trim().toLowerCase();
    const ex=phrases.find(x=>x.text.toLowerCase()===k);
    if(ex)ex.count++;else phrases.push({text:p.trim(),count:1});
  }));
  phrases.sort((a,b)=>b.count-a.count);
  const fmtCounts={};
  appts.forEach(c=>{if(c.appt_format&&c.appt_format!=='No Appointment')fmtCounts[c.appt_format]=(fmtCounts[c.appt_format]||0)+1});
  const topFormat=Object.entries(fmtCounts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'';
  const zips=[...new Set(calls.map(c=>c.zip))];
  const zipStats=zips.map(z=>{
    const zCalls=calls.filter(c=>c.zip===z);
    const zAppts=zCalls.filter(c=>c.outcome==='Appointment Set'||c.outcome==='Hot Lead');
    return{zip:z,count:zCalls.length,convRate:zCalls.length?Math.round(zAppts.length/zCalls.length*100):0};
  }).sort((a,b)=>b.count-a.count);
  const motCounts={};
  calls.forEach(c=>(c.motivations||[]).forEach(m=>{motCounts[m]=(motCounts[m]||0)+1}));
  const topMots=Object.entries(motCounts).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return{total,appts:appts.length,convRate,avgDur,phrases,topFormat,zips,zipStats,topMots,allCalls:calls};
}

function renderCol(name,s,isTop,uniq,showEdge){
  return`<div class="caller-col" style="${isTop?'border-color:rgba(0,212,170,0.3)':''}">
  <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><div class="caller-name">${name}</div>${isTop?'<span style="font-size:10px;font-weight:700;color:var(--teal);background:rgba(0,212,170,0.1);padding:2px 8px;border-radius:5px">TOP</span>':''}</div>
  <div class="caller-meta">${s.zips.length} ZIP${s.zips.length!==1?'s':''} · ${s.topMots.map(m=>m[0]).join(', ')||'—'}</div>
  <div class="stat-row"><div class="stat-box"><div class="sv">${s.total}</div><div class="sl">Calls</div></div><div class="stat-box"><div class="sv" style="color:var(--teal)">${s.convRate}%</div><div class="sl">Conversion</div></div><div class="stat-box"><div class="sv">${s.avgDur}<span style="font-size:11px;color:var(--t3)">m</span></div><div class="sl">Avg Duration</div></div></div>
  <div class="stat-row" style="grid-template-columns:1fr 1fr"><div class="stat-box"><div class="sv" style="font-size:16px">${s.appts}</div><div class="sl">Appointments</div></div><div class="stat-box"><div class="sv" style="font-size:14px;color:var(--blue)">${s.topFormat||'—'}</div><div class="sl">Preferred Format</div></div></div>
  ${s.phrases.length?`<div class="sec-lbl">Top Phrases</div><div class="phrase-list">${s.phrases.slice(0,5).map(p=>`<div class="phrase-item"><div class="pi-count">${p.count}</div><div class="pi-text">"${p.text}"</div></div>`).join('')}</div>`:'<p style="font-size:12px;color:var(--t3);margin-bottom:16px">No phrases logged.</p>'}
  ${showEdge&&uniq.length?`<div class="edge-section"><div class="sec-lbl" style="color:var(--teal)">Only ${name} uses</div>${uniq.slice(0,3).map(p=>`<div class="edge-card"><div class="edge-lbl">${name}'s Edge</div><p>"${p.text}"</p></div>`).join('')}</div>`:''}
  </div>`;
}
</script>
